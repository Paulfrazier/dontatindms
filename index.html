  "thesis": "Starting a DM with <code>@Sam</code> feels like making sure Sam sees it. Sam was always going to see it. In a direct message, the message <em>is</em> the ping, and that includes every thread reply, even in a thread Sam hasn't touched yet.",

      "h3": "The one gap: group-DM threads",
      "accent": "--purple",
      "body": "<em>\"In channels or DMs with multiple people, you'll be notified of new replies if you started the thread, replied to it, or were mentioned.\"</em> (<a href=\"https://slack.com/help/articles/115000769927-Use-threads-to-organize-discussions-\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--purple-electric);text-underline-offset:2px\">Slack: Use threads</a>) So if someone in a group DM hasn't touched the thread, the @ is the only thing that reaches them."

      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s, transform 0.25s var(--bounce);
      white-space: nowrap;
    }
    .hud .combo.show { opacity: 1; transform: scale(1); }
    .hud .seg {
      display: flex;
      gap: 4px;
      margin-left: auto;
      flex: 1 1 auto;
      justify-content: flex-end;
      max-width: 55%;
      flex-wrap: wrap;
    }
    .hud .seg i {
      flex: 1 1 6px;
      max-width: 16px;
      height: 8px;
      border-radius: 3px;
      background: rgba(255,255,255,0.22);
      transition: background 0.25s;
    }
    .hud .seg i.done { background: var(--lime); }
    .hud .seg i.current { background: #fff; }

    /* ── Scenario card ── */
    .scenario {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 24px 22px;
      box-shadow: var(--shadow-lg);
    }
    .scenario.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .scenario .q {
      font-size: 18px;
      margin: 0 0 18px;
      line-height: 1.45;
      font-weight: 500;
    }

    /* ── Chunky choice buttons ── */
    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .choices button {
      flex: 1 1 auto;
      padding: 14px 16px;
      border: 2px solid var(--ink);
      background: #fff;
      border-radius: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.12s var(--bounce), box-shadow 0.12s, background 0.15s;
    }
    .choices button:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .choices button:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--ink);
    }
    .choices button:focus-visible {
      outline: 3px solid var(--purple-electric);
      outline-offset: 2px;
    }
    .choices button.correct {
      background: var(--lime);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .choices button.wrong {
      background: var(--coral);
      color: #fff;
      box-shadow: 3px 3px 0 var(--ink);
    }
    .choices button.reveal-correct {
      background: var(--lime-tint);
      color: var(--lime-ink);
    }
    .choices button:disabled { cursor: default; }

    /* ── Feedback ── */
    .feedback {
      margin-top: 16px;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 14.5px;
      border: 2px solid var(--ink);
      display: none;
    }
    .feedback.show { display: block; animation: pop 0.3s var(--bounce); }
    @keyframes pop {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .feedback.right { background: var(--lime-tint); }
    .feedback.wrong { background: var(--coral-tint); }
    .feedback .verdict { font-weight: 700; margin-right: 4px; font-family: "Space Grotesk", sans-serif; }

    /* ── +points popup ── */
    .points-pop {
      position: absolute;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--lime-ink);
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-46px); opacity: 0; }
    }

    /* ── Nav ── */
    .nav { display: flex; justify-content: flex-end; margin-top: 16px; }
    .nav button, .summary button {
      padding: 12px 26px;
      background: var(--purple-electric);
      color: #fff;
      border: 2px solid var(--ink);
      border-radius: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.12s var(--bounce), box-shadow 0.12s;
    }
    .nav button:hover, .summary button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .nav button:active, .summary button:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--ink);
    }

    /* ── Summary ── */
    .summary {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .summary .big-score {
      font-family: "Space Grotesk", sans-serif;
      font-size: 56px;
      font-weight: 700;
      color: var(--purple-electric);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 0 0 4px;
    }
    .summary .pct { font-size: 16px; color: var(--muted); margin: 0 0 6px; }
    .summary .final-score { font-size: 18px; margin: 0 0 10px; }
    .summary .breakdown { font-size: 14px; color: var(--muted); margin: 0 0 22px; }
    .summary .grade {
      display: inline-block;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      background: var(--lime);
      margin: 0 0 18px;
    }

    .submit-cta {
      margin-top: 16px;
      padding: 14px 18px;
      background: #f3eefc;
      border: 2px dashed var(--purple-electric);
      border-radius: 12px;
      font-size: 14px;
    }
    .submit-cta a { color: var(--purple-electric); font-weight: 700; text-decoration: none; }
    .submit-cta a:hover { text-decoration: underline; }

    .takeaways ul { padding-left: 20px; }
    .takeaways li { margin-bottom: 8px; }

    footer {
      margin-top: 52px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    footer .fairpoint { margin-bottom: 6px; }
    footer .fairpoint a, footer .repo a {
      color: var(--purple-electric);
      font-weight: 600;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      display: none;
    }

    @media (max-width: 540px) {
      .wrap { padding: 20px 16px 60px; }
      h1 { font-size: 34px; }
      .thesis { font-size: 17px; }
      .explainer { grid-template-columns: 1fr; }
      .hud .seg { max-width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <main class="wrap">
    <header>
      <h1 id="h1"></h1>
      <p class="thesis" id="thesis"></p>
    </header>

    <h2 id="explainer-heading"></h2>
    <div class="explainer" id="explainer"></div>
    <div class="trap" id="trap"></div>

    <div class="hud" id="hud">
      <div class="score-block">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
      <span class="combo" id="combo">🔥 ×1</span>
      <div class="seg" id="seg"></div>
    </div>

    <h2 id="quiz-heading"></h2>
    <div id="quiz"></div>

    <div class="submit-cta" id="submit-cta"></div>

    <h2>Takeaways</h2>
    <div class="takeaways"><ul id="takeaways"></ul></div>

    <footer>
      <div class="fairpoint">More from <a id="cross-promo" href="#" target="_blank" rel="noopener">Fairpoint →</a></div>
      <span class="repo">A tiny educational app. <a id="repo-link" href="#" target="_blank" rel="noopener">Source on GitHub</a>.</span>
    </footer>
  </main>

  <script>
    // ── Load config ──────────────────────────────────────────────────
    const CFG = JSON.parse(document.getElementById("site-config").textContent);
    const SCENARIOS = CFG.scenarios;
    const CHOICES = CFG.choices;
    const POINTS = CFG.pointsPerCorrect ?? 100;
    const COMBO_STEP = CFG.comboStep ?? 1;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }
    function accentVar(a) { return a && a.startsWith("--") ? `var(${a})` : (a || "var(--ink)"); }

    // ── Static chrome from config ────────────────────────────────────
    document.title = CFG.title;
    document.querySelector('meta[name="description"]').setAttribute("content", CFG.metaDescription || "");
    document.getElementById("h1").textContent = CFG.h1;
    document.getElementById("thesis").innerHTML = CFG.thesis;                 // trusted (author copy)
    document.getElementById("explainer-heading").textContent = CFG.explainerHeading || "The 30-second explainer";
    document.getElementById("trap").innerHTML = CFG.trap;                     // trusted
    document.getElementById("quiz-heading").textContent = CFG.quizHeading || "Quiz";

    document.getElementById("explainer").replaceChildren(...(CFG.explainer || []).map(e => {
      const div = document.createElement("div");
      div.className = "def";
      const h3 = document.createElement("h3");
      h3.textContent = e.h3;
      h3.style.color = accentVar(e.accent);
      const p = document.createElement("p");
      p.innerHTML = e.body;                                                   // trusted
      div.append(h3, p);
      return div;
    }));

    document.getElementById("takeaways").replaceChildren(...(CFG.takeaways || []).map(t => {
      const li = document.createElement("li");
      li.innerHTML = t;                                                       // trusted
      return li;
    }));

    if (CFG.footer?.repoUrl) {
      const contribUrl = CFG.footer.repoUrl.replace(/\/$/, "") + "/blob/main/CONTRIBUTING.md";
      document.getElementById("submit-cta").innerHTML =
        `Got a good scenario? <a href="${escapeHtml(contribUrl)}" target="_blank" rel="noopener">Submit one as a PR →</a>`;
      document.getElementById("repo-link").href = CFG.footer.repoUrl;
    }
    if (CFG.footer?.crossPromo) document.getElementById("cross-promo").href = CFG.footer.crossPromo;

    // ── Per-choice accent colors (generated, not hard-coded selectors) ──
    const styleEl = document.createElement("style");
    styleEl.textContent = CHOICES.map(c =>
      `.choices button[data-choice="${c.key}"]{color:${accentVar(c.accent)};}` +
      `.choices button[data-choice="${c.key}"].correct,` +
      `.choices button[data-choice="${c.key}"].wrong{color:inherit;}`
    ).join("\n");
    document.head.appendChild(styleEl);

    // ── State ────────────────────────────────────────────────────────
    const quizEl = document.getElementById("quiz");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");
    const segEl = document.getElementById("seg");
    const hudEl = document.getElementById("hud");

    let order = [], idx = 0, correct = 0, score = 0, streak = 0, byCorrect = {};

    function freshTally() { return Object.fromEntries(CHOICES.map(c => [c.key, 0])); }
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildSegments() {
      segEl.replaceChildren(...SCENARIOS.map(() => document.createElement("i")));
    }
    function updateSegments() {
      [...segEl.children].forEach((s, i) => {
        s.className = i < idx ? "done" : (i === idx ? "current" : "");
      });
    }
    function setCombo() {
      const mult = comboMultiplier();
      if (streak >= 2) {
        comboEl.textContent = `🔥 ×${mult}`;
        comboEl.classList.add("show");
      } else {
        comboEl.classList.remove("show");
      }
    }
    function comboMultiplier() { return Math.max(1, 1 + (streak - 1) * COMBO_STEP); }

    function animateScore(to) {
      const from = parseInt(scoreEl.textContent.replace(/\D/g, ""), 10) || 0;
      const start = performance.now(), dur = 500;
      function tick(now) {
        const p = Math.min(1, (now - start) / dur);
        scoreEl.textContent = Math.round(from + (to - from) * p).toLocaleString();
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function startQuiz() {
      order = shuffle([...Array(SCENARIOS.length).keys()]);
      idx = 0; correct = 0; score = 0; streak = 0; byCorrect = freshTally();
      scoreEl.textContent = "0";
      comboEl.classList.remove("show");
      buildSegments();
      renderQuestion();
    }

    function renderQuestion() {
      updateSegments();
      const s = SCENARIOS[order[idx]];
      const last = idx === SCENARIOS.length - 1;
      const card = document.createElement("div");
      card.className = "scenario";
      card.style.position = "relative";

      const choiceBtns = CHOICES.map(c =>
        `<button data-choice="${escapeHtml(c.key)}">${escapeHtml(c.label)}</button>`
      ).join("");

      card.innerHTML = `
        <p class="q">${escapeHtml(s.q)}</p>
        <div class="choices">${choiceBtns}</div>
        <div class="feedback"></div>
        <div class="nav" style="display:none"><button id="next-btn">${last ? "See results →" : "Next →"}</button></div>
      `;

      const buttons = card.querySelectorAll(".choices button");
      const feedback = card.querySelector(".feedback");
      const nav = card.querySelector(".nav");

      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          const choice = btn.dataset.choice;
          const isRight = choice === s.correct;
          buttons.forEach(b => b.disabled = true);

          if (isRight) {
            btn.classList.add("correct");
            correct++; streak++; byCorrect[s.correct]++;
            const gained = POINTS * comboMultiplier();
            score += gained;
            animateScore(score);
            setCombo();
            popPoints(btn, gained);
          } else {
            btn.classList.add("wrong");
            streak = 0;
            setCombo();
            card.classList.add("shake");
            setTimeout(() => card.classList.remove("shake"), 400);
            const rightBtn = card.querySelector(`button[data-choice="${CSS.escape(s.correct)}"]`);
            if (rightBtn) rightBtn.classList.add("reveal-correct");
          }

          feedback.classList.add("show", isRight ? "right" : "wrong");
          feedback.innerHTML = `<span class="verdict">${isRight ? "✓ Correct." : "✗ Not quite."}</span>${s.why[choice]}`; // trusted
          nav.style.display = "flex";
        });
      });

      card.querySelector("#next-btn").addEventListener("click", () => {
        idx++;
        if (idx >= SCENARIOS.length) renderSummary();
        else { renderQuestion(); scrollToQuiz(); }
      });

      quizEl.replaceChildren(card);
    }

    function popPoints(btn, amount) {
      const card = btn.closest(".scenario");
      const pop = document.createElement("div");
      pop.className = "points-pop";
      pop.textContent = `+${amount.toLocaleString()}`;
      pop.style.left = (btn.offsetLeft + btn.offsetWidth / 2 - 20) + "px";
      pop.style.top = (btn.offsetTop - 10) + "px";
      card.appendChild(pop);
      setTimeout(() => pop.remove(), 900);
    }

    function gradeFor(pct) {
      if (pct >= 90) return { label: "Slack sensei 🥷", bg: "var(--lime)" };
      if (pct >= 70) return { label: "Solid etiquette ✓", bg: "var(--lime)" };
      if (pct >= 50) return { label: "Getting there", bg: "var(--gold)" };
      return { label: "Room to grow", bg: "var(--coral)" };
    }

    function renderSummary() {
      updateSegments();
      [...segEl.children].forEach(s => s.className = "done");
      const pct = Math.round((correct / SCENARIOS.length) * 100);
      const grade = gradeFor(pct);
      const breakdown = CHOICES
        .map(c => `${(CFG.breakdownLabels?.[c.key]) || c.label}: ${byCorrect[c.key]}`)
        .join(" · ");

      const card = document.createElement("div");
      card.className = "summary";
      card.innerHTML = `
        <div class="big-score" id="sum-score">0</div>
        <p class="pct">points · ${pct}% correct</p>
        <span class="grade" style="background:${grade.bg}">${grade.label}</span>
        <p class="final-score">You got <strong>${correct}</strong> of ${SCENARIOS.length} right.</p>
        <p class="breakdown">Correct by choice — ${escapeHtml(breakdown)}</p>
        <button id="restart-btn">Play again ↺</button>
      `;
      quizEl.replaceChildren(card);

      // count-up the final score
      const target = score, el = card.querySelector("#sum-score");
      const start = performance.now(), dur = 900;
      (function tick(now) {
        const p = Math.min(1, (now - start) / dur);
        el.textContent = Math.round(target * p).toLocaleString();
        if (p < 1) requestAnimationFrame(tick);
      })(performance.now());

      card.querySelector("#restart-btn").addEventListener("click", () => { startQuiz(); scrollToQuiz(); });
      if (pct >= 70) fireConfetti();
    }

    function scrollToQuiz() {
      window.scrollTo({ top: hudEl.offsetTop - 8, behavior: "smooth" });
    }

    // ── Tiny dependency-free confetti ────────────────────────────────
    function fireConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      canvas.style.display = "block";
      canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
      ctx.scale(dpr, dpr);
      const colors = ["#6D28D9", "#84CC16", "#FB5D3C", "#ECB22E", "#4A154B"];
      const parts = Array.from({ length: 130 }, () => ({
        x: innerWidth / 2, y: innerHeight / 3,
        vx: (Math.random() - 0.5) * 14, vy: Math.random() * -12 - 4,
        s: Math.random() * 7 + 4, c: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3
      }));
      const t0 = performance.now();
      (function frame(now) {
        const elapsed = now - t0;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        parts.forEach(p => {
          p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
          ctx.restore();
        });
        if (elapsed < 2600) requestAnimationFrame(frame);
        else { ctx.clearRect(0, 0, innerWidth, innerHeight); canvas.style.display = "none"; }
      })(t0);
    }

    // ── Keyboard support: 1..9 to answer, Enter to advance ───────────
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const next = document.getElementById("next-btn");
        if (next && next.offsetParent !== null) { next.click(); return; }
        const restart = document.getElementById("restart-btn");
        if (restart) restart.click();
        return;
      }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= CHOICES.length) {
        const btns = quizEl.querySelectorAll(".choices button");
        if (btns[n - 1] && !btns[n - 1].disabled) btns[n - 1].click();
      }
    });

    startQuiz();
  </script>
</body>
</html>
